<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#18222c">Puerta exacta de la fila D</text>
  <text x="550" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#485766">Contracción sobre el subespacio primitivo</text>

  <!-- plot area: origin (120,660), top-right (900,110) -->
  <polygon points="120,660 900,110 900,660" fill="#3a9d5d" fill-opacity="0.20"/>
  <polygon points="120,660 120,110 900,110" fill="#cf4b4b" fill-opacity="0.14"/>

  <g stroke="#bac3ca" stroke-width="1" opacity="0.55">
    <line x1="276" y1="110" x2="276" y2="660"/><line x1="432" y1="110" x2="432" y2="660"/>
    <line x1="588" y1="110" x2="588" y2="660"/><line x1="744" y1="110" x2="744" y2="660"/>
    <line x1="120" y1="550" x2="900" y2="550"/><line x1="120" y1="440" x2="900" y2="440"/>
    <line x1="120" y1="330" x2="900" y2="330"/><line x1="120" y1="220" x2="900" y2="220"/>
  </g>

  <g stroke="#18222c" stroke-width="3" fill="none">
    <line x1="120" y1="660" x2="930" y2="660"/><polyline points="916,650 930,660 916,670"/>
    <line x1="120" y1="680" x2="120" y2="90"/><polyline points="110,104 120,90 130,104"/>
  </g>
  <line x1="120" y1="660" x2="900" y2="110" stroke="#202020" stroke-width="4"/>

  <g font-family="sans-serif" font-size="16" fill="#46515b">
    <text x="276" y="686" text-anchor="middle">1</text><text x="432" y="686" text-anchor="middle">2</text>
    <text x="588" y="686" text-anchor="middle">3</text><text x="744" y="686" text-anchor="middle">4</text><text x="900" y="686" text-anchor="middle">5</text>
    <text x="100" y="555" text-anchor="end">1</text><text x="100" y="445" text-anchor="end">2</text>
    <text x="100" y="335" text-anchor="end">3</text><text x="100" y="225" text-anchor="end">4</text><text x="100" y="115" text-anchor="end">5</text>
  </g>

  <text x="520" y="730" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#18222c">x = ‖BF‖  (borde / torsor)</text>
  <text x="34" y="385" text-anchor="middle" transform="rotate(-90 34 385)" font-family="sans-serif" font-size="20" fill="#18222c">y = ‖SF‖  (secciones / Poisson)</text>

  <text x="270" y="165" font-family="sans-serif" font-size="20" fill="#982b2b">Bₙᵤ꜀(F,F) = ‖SF‖² − ‖BF‖² &gt; 0</text>
  <text x="565" y="610" font-family="sans-serif" font-size="23" fill="#176332">Bₙᵤ꜀(F,F) ≤ 0</text>
  <text x="680" y="230" transform="rotate(-35 680 230)" font-family="sans-serif" font-size="18" fill="#202020">frontera ‖SF‖ = ‖BF‖</text>

  <!-- schematic admissible points -->
  <g fill="#287a43" stroke="#ffffff" stroke-width="2">
    <circle cx="276" cy="600" r="9"/><circle cx="362" cy="545" r="9"/><circle cx="463" cy="478" r="9"/>
    <circle cx="572" cy="423" r="9"/><circle cx="697" cy="330" r="9"/>
  </g>
  <path d="M690 515 C650 500 620 465 578 430" fill="none" stroke="#287a43" stroke-width="3"/>
  <polygon points="578,430 590,434 582,443" fill="#287a43"/>
  <text x="695" y="535" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#185c30">Todas las clases primitivas</text>
  <text x="695" y="559" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#185c30">deben quedar aquí</text>

  <!-- forbidden witness -->
  <g stroke="#ae2929" stroke-width="5"><line x1="525" y1="270" x2="545" y2="290"/><line x1="545" y1="270" x2="525" y2="290"/></g>
  <path d="M380 206 C430 213 476 241 525 274" fill="none" stroke="#ae2929" stroke-width="3"/>
  <polygon points="525,274 512,273 519,263" fill="#ae2929"/>
  <text x="330" y="186" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#8e2020">Un solo punto aquí</text>
  <text x="330" y="210" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#8e2020">impide cerrar D</text>

  <!-- equality point -->
  <polygon points="769,192 782,205 769,218 756,205" fill="#d18c00" stroke="#ffffff" stroke-width="2"/>
  <path d="M858 268 C830 248 806 230 779 211" fill="none" stroke="#ad7300" stroke-width="3"/>
  <polygon points="779,211 791,214 784,224" fill="#ad7300"/>
  <text x="875" y="286" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#805500">En la frontera hay que probar:</text>
  <text x="875" y="309" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#805500">igualdad ⇒ clase principal/nula</text>

  <text x="550" y="752" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6d7882">Los puntos son esquemáticos: muestran la condición geométrica, no datos calculados.</text>
</svg>
